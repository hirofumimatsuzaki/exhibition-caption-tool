<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>展示キャプション管理ツール</title>
  <style>
    :root {
      --bg: #f6f2ea;
      --paper: #fffaf2;
      --ink: #1f1a14;
      --muted: #6e6256;
      --line: #e1d8cc;
      --accent: #b65c2a;
      --shadow: 0 14px 40px rgba(31, 26, 20, 0.12);
      --error: #b23a2a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Noto Serif JP", serif;
      background:
        radial-gradient(1200px 800px at 20% -10%, rgba(182, 92, 42, 0.08), transparent 60%),
        radial-gradient(1000px 700px at 120% 10%, rgba(31, 26, 20, 0.08), transparent 55%),
        var(--bg);
      color: var(--ink);
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 64px 20px 96px;
      display: grid;
      gap: 36px;
    }

    header {
      display: grid;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2.2vw + 1.2rem, 2.6rem);
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      font-size: 1rem;
      color: var(--ink);
    }

    textarea {
      min-height: 200px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid rgba(182, 92, 42, 0.35);
      border-color: rgba(182, 92, 42, 0.6);
    }

    .field-error input,
    .field-error textarea {
      border-color: rgba(178, 58, 42, 0.6);
      outline-color: rgba(178, 58, 42, 0.4);
    }

    .field-error .hint {
      color: var(--error);
    }

    .hint {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .button-row {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      cursor: pointer;
    }

    button.primary {
      background: var(--ink);
      color: #fff;
    }

    button:hover {
      background: #efe8dd;
    }

    button.primary:hover {
      background: #2b241d;
    }

    button:focus {
      outline: 2px solid rgba(182, 92, 42, 0.35);
      outline-offset: 2px;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .toggle-group {
      display: grid;
      gap: 8px;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .toggle-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .toggle-group input {
      width: 18px;
      height: 18px;
    }

    .caption-list {
      display: grid;
      gap: 20px;
    }

    .caption-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: grid;
      gap: 10px;
    }

    .caption-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .caption-index {
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .caption-title {
      font-size: clamp(1.5rem, 2vw + 1rem, 2.2rem);
      font-weight: 600;
      margin: 0;
    }

    .caption-author {
      font-size: clamp(1.05rem, 1vw + 0.9rem, 1.3rem);
      font-weight: 500;
      margin: 0;
      color: var(--muted);
    }

    .caption-desc {
      margin: 0;
      font-size: 1rem;
      white-space: pre-wrap;
    }

    .card-actions {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .empty {
      color: #b7ada3;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    @media (max-width: 720px) {
      main {
        padding: 36px 16px 60px;
      }

      .panel {
        padding: 20px;
      }

      textarea {
        min-height: 180px;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 18mm;
      }

      body {
        background: #fff;
      }

      main {
        padding: 0;
        max-width: none;
      }

      header,
      .form,
      .actions,
      .controls,
      .card-actions,
      .caption-index,
      button,
      .empty {
        display: none !important;
      }

      .panel {
        border: none;
        box-shadow: none;
        padding: 0;
        background: transparent;
      }

      .caption-list {
        gap: 0;
      }

      .caption-card {
        border: none;
        padding: 0;
        border-radius: 0;
        gap: 10px;
      }

      .print-one .caption-card {
        break-after: page;
        page-break-after: always;
      }

      .print-one .caption-card:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .print-two .caption-card {
        min-height: calc(50vh - 4mm);
        break-inside: avoid;
      }

      .print-two .caption-card:nth-child(2n) {
        break-after: page;
        page-break-after: always;
      }

      .print-two .caption-card:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .caption-title {
        font-size: 20pt;
      }

      .caption-author {
        font-size: 13pt;
      }

      .caption-desc {
        font-size: 11.5pt;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>展示キャプション管理ツール</h1>
      <p>インスタ投稿文を貼り付けて1件ずつ追加し、まとめて印刷できます。</p>
    </header>

    <section class="panel form" aria-label="入力">
      <label id="titleField">
        タイトル
        <input id="titleInput" type="text" placeholder="作品タイトル" />
        <span class="hint" id="titleHint">必須</span>
      </label>
      <label id="authorField">
        作家名
        <input id="authorInput" type="text" placeholder="作家名" />
        <span class="hint" id="authorHint">必須</span>
      </label>
      <label id="descField">
        本文
        <textarea id="descInput" placeholder="本文を貼り付けてください。改行はそのまま反映されます。"></textarea>
        <span class="hint" id="descHint">必須</span>
      </label>

      <div class="actions">
        <div class="button-row">
          <button type="button" class="primary" id="addButton">追加</button>
          <button type="button" id="printButton">まとめて印刷（PDF）</button>
          <button type="button" id="clearAllButton">全消去</button>
        </div>
      </div>
    </section>

    <section class="panel controls" aria-label="印刷設定">
      <div class="toggle-group" role="radiogroup" aria-label="印刷枚数設定">
        <label>
          <input type="radio" name="printLayout" value="one" checked />
          1キャプション = 1ページ
        </label>
        <label>
          <input type="radio" name="printLayout" value="two" />
          2キャプション = 1ページ
        </label>
      </div>
    </section>

    <section class="panel" aria-label="キャプション一覧">
      <div class="caption-list" id="captionList">
        <p class="caption-desc empty" id="emptyState">まだキャプションがありません。</p>
      </div>
    </section>
  </main>

  <script>
    const titleInput = document.getElementById("titleInput");
    const authorInput = document.getElementById("authorInput");
    const descInput = document.getElementById("descInput");
    const addButton = document.getElementById("addButton");
    const printButton = document.getElementById("printButton");
    const clearAllButton = document.getElementById("clearAllButton");
    const captionList = document.getElementById("captionList");
    const emptyState = document.getElementById("emptyState");

    const titleField = document.getElementById("titleField");
    const authorField = document.getElementById("authorField");
    const descField = document.getElementById("descField");

    const STORAGE_KEY_ITEMS = "captionListItems";
    const STORAGE_KEY_LAYOUT = "captionPrintLayout";

    let items = [];
    let editingIndex = null;

    const setFieldError = (field, hint, hasError, message) => {
      field.classList.toggle("field-error", hasError);
      if (message) {
        hint.textContent = message;
      }
    };

    const clearFieldErrors = () => {
      setFieldError(titleField, document.getElementById("titleHint"), false, "必須");
      setFieldError(authorField, document.getElementById("authorHint"), false, "必須");
      setFieldError(descField, document.getElementById("descHint"), false, "必須");
    };

    const validateInputs = () => {
      clearFieldErrors();
      let valid = true;

      if (!titleInput.value.trim()) {
        setFieldError(titleField, document.getElementById("titleHint"), true, "タイトルを入力してください");
        valid = false;
      }
      if (!authorInput.value.trim()) {
        setFieldError(authorField, document.getElementById("authorHint"), true, "作家名を入力してください");
        valid = false;
      }
      if (!descInput.value.trim()) {
        setFieldError(descField, document.getElementById("descHint"), true, "本文を入力してください");
        valid = false;
      }

      return valid;
    };

    const resetForm = () => {
      titleInput.value = "";
      authorInput.value = "";
      descInput.value = "";
      editingIndex = null;
      addButton.textContent = "追加";
      clearFieldErrors();
    };

    const saveItems = () => {
      localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
    };

    const loadItems = () => {
      const saved = localStorage.getItem(STORAGE_KEY_ITEMS);
      if (!saved) {
        return;
      }
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          items = parsed;
        }
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY_ITEMS);
      }
    };

    const renderList = () => {
      captionList.innerHTML = "";
      if (!items.length) {
        captionList.appendChild(emptyState);
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "caption-card";

        const header = document.createElement("div");
        header.className = "caption-header";

        const indexLabel = document.createElement("div");
        indexLabel.className = "caption-index";
        indexLabel.textContent = `#${index + 1}`;

        const title = document.createElement("h2");
        title.className = "caption-title";
        title.textContent = item.title;

        const author = document.createElement("h3");
        author.className = "caption-author";
        author.textContent = item.author;

        const desc = document.createElement("p");
        desc.className = "caption-desc";
        desc.textContent = item.text;

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "編集";
        editButton.addEventListener("click", () => {
          titleInput.value = item.title;
          authorInput.value = item.author;
          descInput.value = item.text;
          editingIndex = index;
          addButton.textContent = "更新";
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "削除";
        deleteButton.addEventListener("click", () => {
          items.splice(index, 1);
          saveItems();
          renderList();
        });

        const upButton = document.createElement("button");
        upButton.type = "button";
        upButton.textContent = "上へ";
        upButton.disabled = index === 0;
        upButton.addEventListener("click", () => {
          if (index === 0) {
            return;
          }
          const [moved] = items.splice(index, 1);
          items.splice(index - 1, 0, moved);
          saveItems();
          renderList();
        });

        const downButton = document.createElement("button");
        downButton.type = "button";
        downButton.textContent = "下へ";
        downButton.disabled = index === items.length - 1;
        downButton.addEventListener("click", () => {
          if (index === items.length - 1) {
            return;
          }
          const [moved] = items.splice(index, 1);
          items.splice(index + 1, 0, moved);
          saveItems();
          renderList();
        });

        actions.appendChild(editButton);
        actions.appendChild(deleteButton);
        actions.appendChild(upButton);
        actions.appendChild(downButton);

        header.appendChild(title);
        header.appendChild(indexLabel);

        card.appendChild(header);
        card.appendChild(author);
        card.appendChild(desc);
        card.appendChild(actions);

        captionList.appendChild(card);
      });
    };

    const applyLayout = (layout) => {
      document.body.classList.toggle("print-one", layout === "one");
      document.body.classList.toggle("print-two", layout === "two");
      localStorage.setItem(STORAGE_KEY_LAYOUT, layout);
    };

    addButton.addEventListener("click", () => {
      if (!validateInputs()) {
        return;
      }

      const entry = {
        title: titleInput.value.trim(),
        author: authorInput.value.trim(),
        text: descInput.value.trim(),
      };

      if (editingIndex !== null) {
        items[editingIndex] = entry;
      } else {
        items.push(entry);
      }

      saveItems();
      renderList();
      resetForm();
    });

    printButton.addEventListener("click", () => {
      window.print();
    });

    clearAllButton.addEventListener("click", () => {
      const ok = window.confirm("全てのキャプションを消去します。よろしいですか？");
      if (!ok) {
        return;
      }
      items = [];
      saveItems();
      renderList();
      resetForm();
    });

    document.querySelectorAll("input[name=printLayout]").forEach((radio) => {
      radio.addEventListener("change", (event) => {
        applyLayout(event.target.value);
      });
    });

    [titleInput, authorInput, descInput].forEach((input) => {
      input.addEventListener("input", () => {
        if (editingIndex !== null) {
          return;
        }
        clearFieldErrors();
      });
    });

    const initialize = () => {
      loadItems();
      renderList();

      const savedLayout = localStorage.getItem(STORAGE_KEY_LAYOUT) || "one";
      const selected = document.querySelector(`input[name=printLayout][value="${savedLayout}"]`);
      if (selected) {
        selected.checked = true;
      }
      applyLayout(savedLayout);
    };

    initialize();
  </script>
</body>
</html>
